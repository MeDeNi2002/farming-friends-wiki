
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAF Marketplace & Values Wiki</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101810;
      color: #edf5e9;
    }
    header {
      background: #1b2b1d;
      padding: 25px 18px;
      text-align: center;
      border-bottom: 2px solid #466b3d;
    }
    header h1 { margin: 0 0 8px; color: #a8dc83; }
    header p { margin: 0; color: #c4d5bd; }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    .panel {
      background: #1b291d;
      border: 1px solid #38543a;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
    }
    h2 { color: #a8dc83; margin-top: 0; }
    input, select, textarea, button {
      width: 100%;
      padding: 11px;
      margin: 6px 0;
      border-radius: 7px;
      border: 1px solid #496849;
      background: #111b12;
      color: white;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      background: #477b3c;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #5b954c; }
    button.secondary { background: #405344; }
    button.danger { background: #963f3f; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .filters button {
      width: auto;
      padding: 9px 13px;
      margin: 0;
    }
    .filters button.active { background: #8bbf68; color: #10200e; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .item {
      background: #1b291d;
      border: 1px solid #38543a;
      border-radius: 11px;
      overflow: hidden;
    }
    .item img {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #263528;
    }
    .item-content { padding: 13px; }
    .item h3 { margin: 0 0 8px; color: #b6e393; }
    .category {
      display: inline-block;
      background: #304a30;
      color: #c8e9ad;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .description { color: #d0d9cd; white-space: pre-wrap; }
    .admin-actions { display: flex; gap: 7px; }
    .admin-actions button { flex: 1; }
    .hidden { display: none !important; }
    .muted { color: #aab9a6; font-size: 13px; }
    #message { margin: 10px 0; color: #b8e89b; }
    footer { text-align: center; padding: 25px; color: #81917e; }
  </style>
</head>
<body>

<header>
  <h1>FAF Marketplace & Values Wiki</h1>
  <p>Farming & Friends — Items, Values and Information</p>
</header>

<main>
  <section class="panel" id="loginPanel">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p class="muted">Only authorized administrators can add, edit or delete items.</p>
    <div id="loginMessage"></div>
  </section>

  <section class="panel hidden" id="adminPanel">
    <h2>Admin Panel</h2>
    <p id="adminStatus" class="muted">You are logged in as an admin.</p>

    <h3 id="formTitle">Add New Item</h3>
    <input id="itemName" type="text" placeholder="Item name">

    <select id="itemCategory">
      <option value="Seeds">Seeds</option>
      <option value="Cars">Cars</option>
      <option value="Tractors">Tractors</option>
      <option value="Trucks">Trucks</option>
      <option value="Harvesters">Harvesters</option>
      <option value="Equipments">Equipments</option>
      <option value="Events">Events</option>
      <option value="Developer Items">Developer Items</option>
    </select>

    <textarea id="itemDescription" placeholder="Description, value, information..."></textarea>
    <label for="itemImage" class="muted">Item image</label>
    <input id="itemImage" type="file" accept="image/*">

    <button id="saveBtn">Add Item</button>
    <button id="cancelEditBtn" class="secondary hidden">Cancel Edit</button>
    <button id="logoutBtn" class="danger">Logout</button>
    <div id="message"></div>
  </section>

  <section>
    <h2>Wiki Items</h2>
    <div class="filters" id="filters"></div>
    <div id="items" class="grid"></div>
    <p id="emptyMessage" class="muted hidden">No items found in this category yet.</p>
  </section>
</main>

<footer>FAF Marketplace & Values Wiki</footer>

<script>
  const SUPABASE_URL = "https://hhlfsbfyzqgmupzvwkfw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_kZmcyKVx-lMt7QVFXqakmw_w5hCVvXv";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const categories = [
    "All",
    "Seeds",
    "Cars",
    "Tractors",
    "Trucks",
    "Harvesters",
    "Equipments",
    "Events",
    "Developer Items"
  ];

  let currentCategory = "All";
  let currentUser = null;
  let isAdmin = false;
  let editingId = null;
  let items = [];

  const el = id => document.getElementById(id);

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function showMessage(message, isError = false) {
    el("message").textContent = message;
    el("message").style.color = isError ? "#ff9999" : "#b8e89b";
  }

  function showLoginMessage(message) {
    el("loginMessage").textContent = message;
  }

  function renderFilters() {
    el("filters").innerHTML = categories.map(category => `
      <button
        class="${currentCategory === category ? "active" : ""}"
        data-category="${escapeHTML(category)}">
        ${escapeHTML(category)}
      </button>
    `).join("");

    el("filters").querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        currentCategory = button.dataset.category;
        renderFilters();
        renderItems();
      });
    });
  }

  async function loadItems() {
    const { data, error } = await db
      .from("items")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      el("items").textContent = "Could not load items: " + error.message;
      return;
    }

    items = data || [];
    renderItems();
  }

  function renderItems() {
    const filtered = currentCategory === "All"
      ? items
      : items.filter(item => item.category === currentCategory);

    el("emptyMessage").classList.toggle("hidden", filtered.length !== 0);

    el("items").innerHTML = filtered.map(item => `
      <article class="item">
        ${item.image_url
          ? `<img src="${escapeHTML(item.image_url)}" alt="${escapeHTML(item.name)}">`
          : `<div style="height:165px;background:#263528;display:grid;place-items:center;color:#aab9a6">No image</div>`
        }
        <div class="item-content">
          <span class="category">${escapeHTML(item.category)}</span>
          <h3>${escapeHTML(item.name)}</h3>
          <p class="description">${escapeHTML(item.description || "")}</p>
          ${isAdmin ? `
            <div class="admin-actions">
              <button class="editBtn" data-id="${escapeHTML(item.id)}">Edit</button>
              <button class="danger deleteBtn" data-id="${escapeHTML(item.id)}">Delete</button>
            </div>
          ` : ""}
        </div>
      </article>
    `).join("");

    if (isAdmin) {
      el("items").querySelectorAll(".editBtn").forEach(button => {
        button.addEventListener("click", () => startEdit(button.dataset.id));
      });

      el("items").querySelectorAll(".deleteBtn").forEach(button => {
        button.addEventListener("click", () => deleteItem(button.dataset.id));
      });
    }
  }

  async function checkAdmin() {
    const { data: { user } } = await db.auth.getUser();
    currentUser = user;
    isAdmin = false;

    if (user) {
      const { data, error } = await db.rpc("is_admin");
      if (!error) isAdmin = data === true;
    }

    el("loginPanel").classList.toggle("hidden", isAdmin);
    el("adminPanel").classList.toggle("hidden", !isAdmin);

    renderItems();
  }

  async function login() {
    const email = el("email").value.trim();
    const password = el("password").value;

    showLoginMessage("Logging in...");

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      showLoginMessage(error.message);
      return;
    }

    await checkAdmin();

    if (!isAdmin) {
      showLoginMessage("This account is not an authorized admin.");
      await db.auth.signOut();
      await checkAdmin();
    } else {
      showLoginMessage("");
      showMessage("Logged in successfully!");
    }
  }

  async function logout() {
    await db.auth.signOut();
    resetForm();
    await checkAdmin();
    showLoginMessage("Logged out.");
  }

  function resetForm() {
    editingId = null;
    el("itemName").value = "";
    el("itemCategory").value = "Seeds";
    el("itemDescription").value = "";
    el("itemImage").value = "";
    el("formTitle").textContent = "Add New Item";
    el("saveBtn").textContent = "Add Item";
    el("cancelEditBtn").classList.add("hidden");
    showMessage("");
  }

  function startEdit(id) {
    const item = items.find(entry => entry.id === id);
    if (!item) return;

    editingId = id;
    el("itemName").value = item.name || "";
    el("itemCategory").value = item.category || "Seeds";
    el("itemDescription").value = item.description || "";
    el("itemImage").value = "";
    el("formTitle").textContent = "Edit Item";
    el("saveBtn").textContent = "Save Changes";
    el("cancelEditBtn").classList.remove("hidden");

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function saveItem() {
    if (!isAdmin) return;

    const name = el("itemName").value.trim();
    const category = el("itemCategory").value;
    const description = el("itemDescription").value.trim();
    const file = el("itemImage").files[0];

    if (!name) {
      showMessage("Please enter an item name.", true);
      return;
    }

    el("saveBtn").disabled = true;
    showMessage("Saving...");

    try {
      let imageUrl = null;

      if (editingId) {
        const existing = items.find(item => item.id === editingId);
        imageUrl = existing?.image_url || null;
      }

      if (file) {
        const extension = file.name.split(".").pop().toLowerCase();
        const filePath = `${crypto.randomUUID()}.${extension}`;

        const { error: uploadError } = await db.storage
          .from("item-images")
          .upload(filePath, file, { upsert: false });

        if (uploadError) throw uploadError;

        const { data: publicData } = db.storage
          .from("item-images")
          .getPublicUrl(filePath);

        imageUrl = publicData.publicUrl;
      }

      const itemData = {
        name,
        category,
        description,
        image_url: imageUrl
      };

      let result;

      if (editingId) {
        result = await db.from("items").update(itemData).eq("id", editingId);
      } else {
        result = await db.from("items").insert(itemData);
      }

      if (result.error) throw result.error;

      showMessage(editingId ? "Item updated!" : "Item added!");
      resetForm();
      await loadItems();

    } catch (error) {
      showMessage(error.message || "Something went wrong.", true);
    } finally {
      el("saveBtn").disabled = false;
    }
  }

  async function deleteItem(id) {
    if (!isAdmin) return;
    if (!confirm("Are you sure you want to delete this item?")) return;

    const { error } = await db.from("items").delete().eq("id", id);

    if (error) {
      showMessage(error.message, true);
      return;
    }

    showMessage("Item deleted.");
    await loadItems();
  }

  el("loginBtn").addEventListener("click", login);
  el("logoutBtn").addEventListener("click", logout);
  el("saveBtn").addEventListener("click", saveItem);
  el("cancelEditBtn").addEventListener("click", resetForm);

  db.auth.onAuthStateChange(() => {
    setTimeout(() => checkAdmin(), 0);
  });

  renderFilters();
  loadItems();
  checkAdmin();
</script>
</body>
</html>
