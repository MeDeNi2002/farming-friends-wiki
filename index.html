
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAF Marketplace & Values | Wiki</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1512;color:#f2f7f3;font-family:Arial,sans-serif}
header{text-align:center;padding:55px 20px;background:linear-gradient(135deg,#173b28,#101a14);border-bottom:1px solid #345440}
header small{color:#9debb1;letter-spacing:3px}
h1{font-size:clamp(30px,6vw,52px);margin:16px 0}
header p{color:#b4c7b8}
main{max-width:1100px;margin:35px auto;padding:0 18px}
input{width:100%;padding:15px;background:#18251e;border:1px solid #355342;border-radius:10px;color:white;font-size:16px}
nav{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 30px}
button{padding:11px 17px;border-radius:25px;border:1px solid #42644d;background:#192a20;color:white;cursor:pointer}
button.active,button:hover{background:#34794a}
h2{margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:#18251e;border:1px solid #304c3a;border-radius:14px;overflow:hidden}
.photo{height:160px;background:#223b2b;display:flex;align-items:center;justify-content:center;color:#a5b9a9}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:16px}
.category{color:#8fe5a6;font-size:11px;letter-spacing:2px}
h3{margin:9px 0}
.obtained{color:#c0cec3;font-size:13px;line-height:1.5}
.obtained strong{color:#8fe5a6}
footer{text-align:center;padding:30px;color:#879b8b;border-top:1px solid #294233;margin-top:50px}
</style>
</head>
<body>
<header>
<small>FAF MARKETPLACE & VALUES PRESENTS</small>
<h1>🌱 Farming & Friends Wiki</h1>
<p>Your ultimate Farming & Friends item encyclopedia.</p>
</header>
<main>
<input id="search" placeholder="Search seeds, cars, equipments..." oninput="render()">
<nav id="filters">
<button class="active" onclick="filter('All',this)">All</button>
<button onclick="filter('Seeds',this)">Seeds</button>
<button onclick="filter('Cars',this)">Cars</button>
<button onclick="filter('Equipments',this)">Equipments</button>
<button onclick="filter('Events',this)">Events</button>
</nav>
<h2 id="heading">All Items</h2>
<div class="grid" id="items"></div>
</main>
<footer>FAF Marketplace & Values • Community Wiki</footer>
<script>
const data=[
{name:"Add Seed",category:"Seeds",obtained:"Add how this seed is obtained.",image:""},
{name:"Add Car",category:"Cars",obtained:"Add how this car is obtained.",image:""},
{name:"Add Equipment",category:"Equipments",obtained:"Add how this equipment is obtained.",image:""},
{name:"Halloween Event",category:"Events",obtained:"Obtained by doing Halloween Event.",image:""}
];
let selected="All";
function filter(category,button){
selected=category;
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
render();
}
function render(){
const q=document.getElementById("search").value.toLowerCase();
const list=data.filter(x=>(selected==="All"||x.category===selected)&&(x.name+" "+x.category+" "+x.obtained).toLowerCase().includes(q));
document.getElementById("heading").textContent=selected==="All"?"All Items":selected;
document.getElementById("items").innerHTML=list.map(x=>`
<div class="card">
<div class="photo">${x.image?`<img src="${x.image}" alt="${x.name}">`:"Item image"}</div>
<div class="info"><div class="category">${x.category}</div>
<h3>${x.name}</h3><div class="obtained"><strong>Obtained by:</strong> ${x.obtained}</div></div>
</div>`).join("");
}
render();
</script>
</body>
</html>
