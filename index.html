
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAF Marketplace & Values Wiki</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101810;
      color: #edf5e9;
    }

    header {
      background: #1b2b1d;
      padding: 25px 18px;
      text-align: center;
      border-bottom: 2px solid #466b3d;
      position: relative;
    }

    header h1 { margin: 0 0 8px; color: #a8dc83; }
    header p { margin: 0; color: #c4d5bd; }

    .discord-link {
      position: absolute;
      right: 20px;
      top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 15px;
      background: #5865F2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background .2s;
    }

    .discord-link:hover { background: #4752c4; }
    .discord-link svg { width: 22px; height: 22px; fill: white; }

    main { max-width: 1100px; margin: auto; padding: 20px; }

    .panel {
      background: #1b291d;
      border: 1px solid #38543a;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
    }

    h2 { color: #a8dc83; margin-top: 0; }

    input, select, textarea, button {
      width: 100%;
      padding: 11px;
      margin: 6px 0;
      border-radius: 7px;
      border: 1px solid #496849;
      background: #111b12;
      color: white;
      font: inherit;
    }

    textarea { min-height: 90px; resize: vertical; }

    button {
      background: #477b3c;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #5b954c; }
    button.secondary { background: #405344; }
    button.danger { background: #963f3f; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .filters button {
      width: auto;
      padding: 9px 13px;
      margin: 0;
    }

    .filters button.active {
      background: #8bbf68;
      color: #10200e;
    }

    .search-box { margin-bottom: 16px; }

    .search-box input {
      padding: 14px;
      font-size: 16px;
      border: 1px solid #52734b;
      background: #1b291d;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .item {
      background: #1b291d;
      border: 1px solid #38543a;
      border-radius: 11px;
      overflow: hidden;
      transition: transform .2s, border-color .2s;
    }

    .item:hover {
      transform: translateY(-3px);
      border-color: #8bbf68;
    }

    .item-image {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #263528;
      cursor: pointer;
      display: block;
    }

    .no-image {
      height: 165px;
      background: #263528;
      display: grid;
      place-items: center;
      color: #aab9a6;
      cursor: pointer;
    }

    .item-content { padding: 13px; }

    .item h3 {
      margin: 0 0 8px;
      color: #b6e393;
      cursor: pointer;
    }

    .category {
      display: inline-block;
      background: #304a30;
      color: #c8e9ad;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .description {
      color: #d0d9cd;
      white-space: pre-wrap;
    }

    .admin-actions {
      display: flex;
      gap: 7px;
    }

    .admin-actions button { flex: 1; }

    .hidden { display: none !important; }
    .muted { color: #aab9a6; font-size: 13px; }

    #message, #loginMessage {
      margin: 10px 0;
      color: #b8e89b;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #81917e;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      overflow-y: auto;
    }

    .modal-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      background: #1b291d;
      border: 1px solid #52734b;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .6);
      animation: popup .2s ease-out;
      margin: auto;
    }

    @keyframes popup {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      padding: 15px 55px 15px 18px;
      border-bottom: 1px solid #38543a;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 21px;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      background: #405344;
      font-size: 23px;
      line-height: 1;
    }

    .modal-image {
      width: 100%;
      max-height: 430px;
      object-fit: contain;
      display: block;
      background: #111810;
    }

    .modal-no-image {
      height: 230px;
      display: grid;
      place-items: center;
      color: #aab9a6;
      background: #111810;
    }

    .modal-content { padding: 18px; }

    .modal-content .description {
      line-height: 1.6;
      margin-bottom: 0;
    }

    body.modal-open { overflow: hidden; }

    @media (max-width: 650px) {
      header { padding: 75px 15px 22px; }

      .discord-link {
        top: 13px;
        right: 50%;
        transform: translateX(50%);
      }

      .modal-overlay { padding: 12px; }
      .modal-image { max-height: 55vh; }
    }
  </style>
</head>

<body>

<header>
  <a class="discord-link"
     href="https://discord.gg/4X7eTqtFGT"
     target="_blank"
     rel="noopener noreferrer"
     aria-label="Join our Discord server">
    <svg viewBox="0 0 127.14 96.36" aria-hidden="true">
      <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.95 97.68 97.68 0 0 0-29.12 0A72.37 72.37 0 0 0 45.63 0a105.89 105.89 0 0 0-26.25 8.09C2.8 32.65-1.7 56.6.55 80.21a105.73 105.73 0 0 0 32.2 16.15 77.7 77.7 0 0 0 6.9-11.16 68.42 68.42 0 0 1-10.87-5.18c.91-.67 1.8-1.37 2.66-2.1a75.76 75.76 0 0 0 64.35 0c.87.73 1.76 1.43 2.66 2.1a68.68 68.68 0 0 1-10.89 5.19 77 77 0 0 0 6.9 11.15 105.25 105.25 0 0 0 32.22-16.14c2.65-27.36-4.53-51.09-18.98-72.15ZM42.45 65.69c-6.28 0-11.45-5.78-11.45-12.85S36.06 40 42.45 40s11.56 5.78 11.45 12.84c0 7.07-5.05 12.85-11.45 12.85Zm42.24 0c-6.28 0-11.45-5.78-11.45-12.85S78.3 40 84.69 40s11.56 5.78 11.45 12.84c0 7.07-5.05 12.85-11.45 12.85Z"/>
    </svg>
    Join our Discord
  </a>

  <h1>FAF Marketplace & Values Wiki</h1>
  <p>Farming & Friends Items and Information</p>
</header>

<main>
  <section class="panel hidden" id="loginPanel">
    <h2>Admin Login</h2>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="loginMessage"></div>
  </section>

  <section class="panel hidden" id="adminPanel">
    <h2>Admin Panel</h2>
    <p class="muted">You are logged in as an admin.</p>

    <h3 id="formTitle">Add New Item</h3>
    <input id="itemName" type="text" placeholder="Item name">

    <select id="itemCategory">
      <option value="Seeds">Seeds</option>
      <option value="Cars">Cars</option>
      <option value="Tractors">Tractors</option>
      <option value="Trucks">Trucks</option>
      <option value="Trailers">Trailers</option>
      <option value="Harvesters">Harvesters</option>
      <option value="Equipments">Equipments</option>
      <option value="Packs">Packs</option>
      <option value="Developer Items">Developer Items</option>
    </select>

    <textarea id="itemDescription" placeholder="Description, value, information..."></textarea>
    <label for="itemImage" class="muted">Item image</label>
    <input id="itemImage" type="file" accept="image/*">

    <button id="saveBtn">Add Item</button>
    <button id="cancelEditBtn" class="secondary hidden">Cancel Edit</button>
    <button id="logoutBtn" class="danger">Logout</button>
    <div id="message"></div>
  </section>

  <section>
    <h2>Wiki Items</h2>

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="🔍 Search items by name, description or category..."
        aria-label="Search items">
    </div>

    <div class="filters" id="filters"></div>
    <div id="items" class="grid"></div>
    <p id="emptyMessage" class="muted hidden">No items found. Try another search or category.</p>
  </section>
</main>

<div id="itemModal" class="modal-overlay hidden" role="dialog"
     aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    </div>
    <div id="modalImageContainer"></div>
    <div class="modal-content">
      <span class="category" id="modalCategory"></span>
      <p class="description" id="modalDescription"></p>
    </div>
  </div>
</div>

<footer>FAF Marketplace & Values Wiki</footer>

<script>
  const SUPABASE_URL = "https://hhlfsbfyzqgmupzvwkfw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_kZmcyKVx-lMt7QVFXqakmw_w5hCVvXv";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const categories = [
    "All", "Seeds", "Cars", "Tractors", "Trucks", "Trailers",
    "Harvesters", "Equipments", "Packs", "Developer Items"
  ];

  const adminMode =
    new URLSearchParams(window.location.search).get("admin") === "true";

  let currentCategory = "All";
  let isAdmin = false;
  let editingId = null;
  let items = [];

  const el = id => document.getElementById(id);

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function showMessage(message, isError = false) {
    el("message").textContent = message;
    el("message").style.color = isError ? "#ff9999" : "#b8e89b";
  }

  function renderFilters() {
    el("filters").innerHTML = categories.map(category => `
      <button
        class="${currentCategory === category ? "active" : ""}"
        data-category="${escapeHTML(category)}">
        ${escapeHTML(category)}
      </button>
    `).join("");

    el("filters").querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        currentCategory = button.dataset.category;
        renderFilters();
        renderItems();
      });
    });
  }

  async function loadItems() {
    const { data, error } = await db
      .from("items")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      el("items").textContent = "Could not load items: " + error.message;
      return;
    }

    items = data || [];
    renderItems();
  }

  function renderItems() {
    const searchTerm = el("searchInput").value.trim().toLowerCase();

    const filtered = items.filter(item => {
      const matchesCategory =
        currentCategory === "All" || item.category === currentCategory;

      const searchableText = [
        item.name,
        item.description,
        item.category
      ].join(" ").toLowerCase();

      const matchesSearch = searchableText.includes(searchTerm);

      return matchesCategory && matchesSearch;
    });

    el("emptyMessage").classList.toggle("hidden", filtered.length !== 0);

    el("items").innerHTML = filtered.map(item => `
      <article class="item">
        ${item.image_url
          ? `<img class="item-image item-open"
                  src="${escapeHTML(item.image_url)}"
                  alt="${escapeHTML(item.name)}"
                  data-id="${escapeHTML(item.id)}">`
          : `<div class="no-image item-open" data-id="${escapeHTML(item.id)}">No image</div>`
        }

        <div class="item-content">
          <span class="category">${escapeHTML(item.category)}</span>
          <h3 class="item-open" data-id="${escapeHTML(item.id)}">
            ${escapeHTML(item.name)}
          </h3>
          <p class="description">${escapeHTML(item.description || "")}</p>

          ${isAdmin ? `
            <div class="admin-actions">
              <button class="editBtn" data-id="${escapeHTML(item.id)}">Edit</button>
              <button class="danger deleteBtn" data-id="${escapeHTML(item.id)}">Delete</button>
            </div>
          ` : ""}
        </div>
      </article>
    `).join("");

    el("items").querySelectorAll(".item-open").forEach(element => {
      element.addEventListener("click", () => {
        openItem(element.dataset.id);
      });
    });

    if (isAdmin) {
      el("items").querySelectorAll(".editBtn").forEach(button => {
        button.addEventListener("click", () => startEdit(button.dataset.id));
      });

      el("items").querySelectorAll(".deleteBtn").forEach(button => {
        button.addEventListener("click", () => deleteItem(button.dataset.id));
      });
    }
  }

  function openItem(id) {
    const item = items.find(entry => entry.id === id);
    if (!item) return;

    el("modalTitle").textContent = item.name || "Unnamed item";
    el("modalCategory").textContent = item.category || "";
    el("modalDescription").textContent = item.description || "No description available.";

    if (item.image_url) {
      const image = document.createElement("img");
      image.className = "modal-image";
      image.src = item.image_url;
      image.alt = item.name || "Item image";
      el("modalImageContainer").replaceChildren(image);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "modal-no-image";
      placeholder.textContent = "No image available";
      el("modalImageContainer").replaceChildren(placeholder);
    }

    el("itemModal").classList.remove("hidden");
    document.body.classList.add("modal-open");
    el("modalClose").focus();
  }

  function closeItem() {
    el("itemModal").classList.add("hidden");
    document.body.classList.remove("modal-open");
  }

  el("modalClose").addEventListener("click", closeItem);

  el("itemModal").addEventListener("click", event => {
    if (event.target === el("itemModal")) closeItem();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !el("itemModal").classList.contains("hidden")) {
      closeItem();
    }
  });

  async function checkAdmin() {
    el("loginPanel").classList.add("hidden");
    el("adminPanel").classList.add("hidden");
    isAdmin = false;

    const { data: { user } } = await db.auth.getUser();

    let authorizedAdmin = false;

    if (user) {
      const { data, error } = await db.rpc("is_admin");
      authorizedAdmin = !error && data === true;
    }

    isAdmin = adminMode && authorizedAdmin;

    el("loginPanel").classList.toggle("hidden", !adminMode || isAdmin);
    el("adminPanel").classList.toggle("hidden", !isAdmin);

    renderItems();
  }

  async function login() {
    const email = el("email").value.trim();
    const password = el("password").value;

    el("loginMessage").textContent = "Logging in...";

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      el("loginMessage").textContent = error.message;
      return;
    }

    await checkAdmin();

    if (!isAdmin) {
      el("loginMessage").textContent =
        "This account is not an authorized admin.";
      await db.auth.signOut();
      await checkAdmin();
    } else {
      el("loginMessage").textContent = "";
      showMessage("Logged in successfully!");
    }
  }

  async function logout() {
    await db.auth.signOut();
    resetForm();
    await checkAdmin();
    el("loginMessage").textContent = "Logged out.";
  }

  function resetForm() {
    editingId = null;
    el("itemName").value = "";
    el("itemCategory").value = "Seeds";
    el("itemDescription").value = "";
    el("itemImage").value = "";
    el("formTitle").textContent = "Add New Item";
    el("saveBtn").textContent = "Add Item";
    el("cancelEditBtn").classList.add("hidden");
    showMessage("");
  }

  function startEdit(id) {
    const item = items.find(entry => entry.id === id);
    if (!item) return;

    editingId = id;
    el("itemName").value = item.name || "";
    el("itemCategory").value = item.category || "Seeds";
    el("itemDescription").value = item.description || "";
    el("itemImage").value = "";
    el("formTitle").textContent = "Edit Item";
    el("saveBtn").textContent = "Save Changes";
    el("cancelEditBtn").classList.remove("hidden");

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function saveItem() {
    if (!isAdmin) return;

    const name = el("itemName").value.trim();
    const category = el("itemCategory").value;
    const description = el("itemDescription").value.trim();
    const file = el("itemImage").files[0];

    if (!name) {
      showMessage("Please enter an item name.", true);
      return;
    }

    el("saveBtn").disabled = true;
    showMessage("Saving...");

    try {
      let imageUrl = null;

      if (editingId) {
        const existing = items.find(item => item.id === editingId);
        imageUrl = existing?.image_url || null;
      }

      if (file) {
        const extension = file.name.split(".").pop().toLowerCase();
        const filePath = `${crypto.randomUUID()}.${extension}`;

        const { error: uploadError } = await db.storage
          .from("item-images")
          .upload(filePath, file, { upsert: false });

        if (uploadError) throw uploadError;

        const { data: publicData } = db.storage
          .from("item-images")
          .getPublicUrl(filePath);

        imageUrl = publicData.publicUrl;
      }

      const itemData = { name, category, description, image_url: imageUrl };

      const result = editingId
        ? await db.from("items").update(itemData).eq("id", editingId)
        : await db.from("items").insert(itemData);

      if (result.error) throw result.error;

      showMessage(editingId ? "Item updated!" : "Item added!");
      resetForm();
      await loadItems();

    } catch (error) {
      showMessage(error.message || "Something went wrong.", true);
    } finally {
      el("saveBtn").disabled = false;
    }
  }

  async function deleteItem(id) {
    if (!isAdmin) return;
    if (!confirm("Are you sure you want to delete this item?")) return;

    const { error } = await db.from("items").delete().eq("id", id);

    if (error) {
      showMessage(error.message, true);
      return;
    }

    showMessage("Item deleted.");
    await loadItems();
  }

  el("searchInput").addEventListener("input", renderItems);
  el("loginBtn").addEventListener("click", login);
  el("logoutBtn").addEventListener("click", logout);
  el("saveBtn").addEventListener("click", saveItem);
  el("cancelEditBtn").addEventListener("click", resetForm);

  db.auth.onAuthStateChange(() => {
    setTimeout(() => checkAdmin(), 0);
  });

  renderFilters();
  loadItems();
  checkAdmin();
</script>

</body>
</html>
